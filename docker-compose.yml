version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: harbourly_postgres
    environment:
      POSTGRES_USER: harbourly
      POSTGRES_PASSWORD: harbourly_secret
      POSTGRES_DB: harbourly
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
